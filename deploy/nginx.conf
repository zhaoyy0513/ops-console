server {
    listen 80;

    # 知识库文件上传上限 200MB（nginx 默认 1MB，超限直接 413，请求到不了后端）
    client_max_body_size 220m;

    # 前端静态资源（Vue Router history 模式回退 index.html）
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # 上游 = compose 内的后端服务名（ops-backend）的容器内端口
        proxy_pass http://ops-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        # SSH 脚本执行预算 60s、诊断接口最坏 ~90s——30s 默认值会把它们掐断
        proxy_read_timeout 300s;
        # SSE（run-stream）按响应头 X-Accel-Buffering: no 自行关闭缓冲
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
